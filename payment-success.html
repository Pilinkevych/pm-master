<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM Master — Payment Successful</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:#f8fafc; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.card { background:white; border-radius:24px; padding:56px 48px; max-width:480px; width:90%; text-align:center; box-shadow:0 8px 40px rgba(15,23,42,.1); }
.icon { font-size:72px; margin-bottom:24px; }
h1 { font-size:28px; font-weight:900; color:#0f172a; margin-bottom:12px; }
p { font-size:15px; font-weight:500; color:#64748b; line-height:1.6; margin-bottom:8px; }
.plan-badge { display:inline-block; background:rgba(124,58,237,.1); color:#7c3aed; font-size:13px; font-weight:700; padding:6px 16px; border-radius:99px; margin:16px 0 28px; }
.btn { display:inline-block; background:linear-gradient(135deg,#7c3aed,#4f46e5); color:white; padding:14px 32px; border-radius:12px; font-size:15px; font-weight:700; text-decoration:none; cursor:pointer; border:none; font-family:'Inter',sans-serif; }
.btn:hover { opacity:.9; }
.note { font-size:13px; color:#94a3b8; margin-top:20px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎉</div>
  <h1>Payment Successful!</h1>
  <p>Your plan is now active. Welcome to PM Master.</p>
  <div class="plan-badge" id="planBadge">Loading...</div>
  <br>
  <a class="btn" href="/">Go to App →</a>
  <p class="note">A confirmation email will be sent shortly.</p>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const plan = params.get('plan') || '';
const seats = params.get('seats');
const names = {
  quiz_only: 'Quiz Only',
  starter:   'Starter — 3 projects',
  pro:       'Pro — 10 projects',
  unlimited: 'Unlimited',
};
let label = names[plan] || plan;
if (plan.startsWith('team_') && seats) label = `Team — ${seats} seats`;
document.getElementById('planBadge').textContent = '✓ ' + label;
</script>
</body>
</html>
