<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Processing payment...</title>
<script>
  const params = new URLSearchParams(window.location.search);
  const plan = params.get('plan') || '';
  const seats = params.get('seats') || '1';
  window.location.replace('/?payment=success&plan=' + plan + '&seats=' + seats);
</script>
</head>
<body>
  <p style="font-family:sans-serif;text-align:center;margin-top:40px;">⏳ Processing payment, please wait...</p>
</body>
</html>
